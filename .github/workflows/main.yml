name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Daily, so the commit graph on the home page stays current.
    - cron: '17 9 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # src/index.html holds committed build output; a stale copy would deploy old albums or photos.
      - name: Build the home page
        run: python3 scripts/build-home.py

      - name: Fail if committed build output is stale
        run: git diff --exit-code -- src || (echo "Run 'npm run build' and commit src/." && exit 1)

      - name: Check every local reference is servable from S3
        run: python3 scripts/check-links.py src

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Deploy-time only: the refreshed graph is uploaded, not committed. If GitHub
      # cannot be reached the script keeps the committed graph and exits 0.
      - name: Refresh the commit graph from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-home.py --fetch

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync S3 bucket
        run: |
          aws s3 cp ./src s3://harrynicholls.com-website/ --metadata-directive REPLACE --cache-control "max-age=0,no-cache,no-store,must-revalidate" --exclude "*.png" --exclude "*.woff2" --exclude ".git/*" --exclude "terraform/*" --exclude ".DS_Store" --exclude ".gitignore" --exclude "*.mp4" --exclude ".github/*" --recursive
          aws s3 cp ./src s3://harrynicholls.com-website/ --metadata-directive REPLACE --cache-control "public,max-age=63072000" --exclude "*" --include "*.png" --include "*.woff2" --include "*.mp4" --recursive

      - name: Remove objects deleted from src
        run: |
          # cp never deletes. Mirror removals so pages dropped from src/ stop being served.
          # --size-only: the cp passes above already uploaded everything, so nothing is re-uploaded
          # and cache-control metadata is left alone. Excluded patterns are also protected from
          # deletion, which is fine: none of them should exist in the bucket.
          EXCLUDES=(--exclude ".git/*" --exclude "terraform/*" --exclude ".DS_Store" --exclude ".gitignore" --exclude ".github/*")
          echo "Objects that will be deleted:"
          aws s3 sync ./src s3://harrynicholls.com-website/ --delete --size-only --dryrun "${EXCLUDES[@]}" | grep '^(dryrun) delete' || echo "(none)"
          aws s3 sync ./src s3://harrynicholls.com-website/ --delete --size-only "${EXCLUDES[@]}"
