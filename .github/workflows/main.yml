name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # src/ holds committed build output; a stale copy would deploy old pages.
      - name: Build portfolio
        run: python3 scripts/build-portfolio.py

      - name: Fail if committed build output is stale
        run: git diff --exit-code -- src || (echo "Run 'npm run build' and commit src/." && exit 1)

      - name: Check every local reference is servable from S3
        run: python3 scripts/check-links.py src

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync S3 bucket
        run: |
          aws s3 cp ./src s3://harrynicholls.com-website/ --metadata-directive REPLACE --cache-control "max-age=0,no-cache,no-store,must-revalidate" --exclude "*.png" --exclude ".git/*" --exclude "terraform/*" --exclude ".DS_Store" --exclude ".gitignore" --exclude "*.mp4" --exclude ".github/*" --recursive
          aws s3 cp ./src s3://harrynicholls.com-website/ --metadata-directive REPLACE --cache-control "public,max-age=63072000" --exclude "*" --include "*.png" --include "*.mp4" --recursive
